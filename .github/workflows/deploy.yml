name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build (Vercel Build Output API)
        env:
          # Supabase project URL + publishable key: public by design (they ship in
          # every browser bundle; data security is enforced by RLS server-side).
          # Owner-provided values, 2026-10-26 — the GH token cannot write Actions
          # secrets, so they are set literally here. When absent the app still
          # builds in local (localStorage) mode exactly as before.
          VITE_SUPABASE_URL: https://kulxusyathtrkpxdeifj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_b99crpgefEhaCzaT-HY-oA_b_P-4Khx
        run: bash build-vercel.sh

      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}" --yes
